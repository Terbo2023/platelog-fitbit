<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlateLog — Sync</title>
<style>
  :root{ --bg:#0a0f0c; --panel:#131b16; --line:#23302a; --text:#eaf3ee; --muted:#8ea79b; --green:#4ade80; --danger:#e0745e; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 16px; }
  .card{ max-width:480px; margin:0 auto; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; }
  h1{ font-size:18px; margin:0 0 10px; }
  p{ font-size:13px; color:var(--muted); line-height:1.5; }
  textarea{
    width:100%; min-height:100px; background:#0a0f0c; border:1px solid var(--line); color:var(--green);
    border-radius:10px; padding:12px; font-size:12px; font-family:ui-monospace,monospace; margin-top:10px; word-break:break-all;
  }
  button{ width:100%; background:var(--green); color:#062412; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700; margin-top:12px; cursor:pointer; }
  .status{ font-size:13px; margin-top:14px; }
  .status.err{ color:var(--danger); }
  .status.ok{ color:var(--green); }
  .summary{ font-size:13px; margin-top:12px; line-height:1.7; }
  details{ margin-top:14px; }
  summary{ font-size:11px; color:var(--muted); cursor:pointer; }
  pre{ font-size:10px; color:var(--muted); white-space:pre-wrap; word-break:break-all; max-height:200px; overflow:auto; }
</style>
</head>
<body>
  <div class="card">
    <h1>Syncing with Google Health…</h1>
    <p id="statusText">Pulling today's activity.</p>
    <div class="summary" id="summary"></div>
    <div id="result" style="display:none">
      <p><b>Copy this code</b>, then go back to PlateLog → Fitbit sync → paste the result in.</p>
      <textarea id="codeBox" readonly></textarea>
      <button id="copyBtn">Copy code</button>
    </div>
    <details>
      <summary>Debug info (share with me if numbers look wrong)</summary>
      <pre id="debugBox"></pre>
    </details>
  </div>

<script>
  // Same client identity as the connect page — see chat notes on the tradeoff.
  const CLIENT_ID = "1030451755072-q60u6jfgk1h4slqh851vt8q1pg3g4o2i.apps.googleusercontent.com";
  const CLIENT_SECRET = "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";

  const statusEl = document.getElementById("statusText");
  const summaryEl = document.getElementById("summary");
  const resultEl = document.getElementById("result");
  const codeBox = document.getElementById("codeBox");
  const debugBox = document.getElementById("debugBox");
  let debugLines = [];

  function setStatus(msg, cls){ statusEl.textContent = msg; statusEl.className = "status " + (cls||""); }
  function log(x){ debugLines.push(typeof x === "string" ? x : JSON.stringify(x, null, 1)); debugBox.textContent = debugLines.join("\n\n"); }

  // Params arrive via the URL hash so they never hit any server log
  const hash = new URLSearchParams(window.location.hash.slice(1));
  let access = hash.get("a");
  const refresh = hash.get("r");
  let expiresAt = parseInt(hash.get("e") || "0", 10);
  const date = hash.get("date"); // YYYY-MM-DD

  async function refreshIfNeeded(){
    if (access && Date.now() < expiresAt - 60000) return true;
    if (!refresh){ setStatus("Token expired and no refresh token available — reconnect in PlateLog.", "err"); return false; }
    try{
      const res = await fetch("https://oauth2.googleapis.com/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ client_id: CLIENT_ID, client_secret: CLIENT_SECRET, refresh_token: refresh, grant_type: "refresh_token" })
      });
      const data = await res.json();
      log({ refreshResponse: data });
      if (!data.access_token){ setStatus("Couldn't refresh token — reconnect in PlateLog.", "err"); return false; }
      access = data.access_token;
      expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
      return true;
    }catch(e){ setStatus("Refresh failed: " + e.message, "err"); return false; }
  }

  function extractNumber(obj, candidates){
    for (const k of candidates){
      if (obj[k] !== undefined && obj[k] !== null){
        const v = obj[k];
        const n = typeof v === "object" ? NaN : parseFloat(v);
        if (!isNaN(n)) return n;
      }
    }
    return 0;
  }

  function sumSteps(json){
    // Only count Fitbit-sourced points — the phone's own Health Kit tracking
    // reports steps for the same minutes and would double the total otherwise.
    let total = 0, count = 0;
    const points = json.dataPoints || [];
    points.forEach(p => {
      const platform = p.dataSource && p.dataSource.platform;
      if (platform !== "FITBIT") return;
      if (!p.steps) return;
      total += extractNumber(p.steps, ["count","value","intVal"]);
      count++;
    });
    return { total, count };
  }

  async function fetchSteps(){
    const startZ = date + "T00:00:00Z";
    const endDate = new Date(new Date(date + "T00:00:00Z").getTime() + 24*3600*1000).toISOString().slice(0,10);
    const endZ = endDate + "T00:00:00Z";
    const filter = `steps.interval.start_time >= "${startZ}" AND steps.interval.start_time < "${endZ}"`;
    const url = "https://health.googleapis.com/v4/users/me/dataTypes/steps/dataPoints?" +
      new URLSearchParams({ filter, page_size: "500" });
    const res = await fetch(url, { headers: { Authorization: "Bearer " + access, Accept: "application/json" } });
    const json = await res.json();
    log({ steps: json });
    if (!res.ok) return { error: json.error ? json.error.message : "request failed", raw: json };
    return json;
  }

  async function fetchCaloriesRollup(){
    const startZ = date + "T00:00:00Z";
    const endDate = new Date(new Date(date + "T00:00:00Z").getTime() + 24*3600*1000).toISOString().slice(0,10);
    const endZ = endDate + "T00:00:00Z";
    const res = await fetch("https://health.googleapis.com/v4/users/me/dataTypes/total-calories/dataPoints:rollUp", {
      method: "POST",
      headers: { Authorization: "Bearer " + access, "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ range: { startTime: startZ, endTime: endZ } })
    });
    const json = await res.json();
    log({ caloriesRollup: json });
    if (!res.ok) return { error: json.error ? json.error.message : "request failed", raw: json };
    return json;
  }

  function sumCaloriesRollup(json){
    let total = 0;
    const points = json.rollupDataPoints || json.dataPoints || [];
    points.forEach(p => {
      const obj = p.totalCalories || p.value || p;
      total += extractNumber(obj, ["kcal","count","value","energyKcal","calories"]);
    });
    return total;
  }

  async function fetchExerciseUnfiltered(){
    const url = "https://health.googleapis.com/v4/users/me/dataTypes/exercise/dataPoints?" +
      new URLSearchParams({ page_size: "50" });
    const res = await fetch(url, { headers: { Authorization: "Bearer " + access, Accept: "application/json" } });
    const json = await res.json();
    log({ exercise: json });
    if (!res.ok) return { error: json.error ? json.error.message : "request failed", raw: json };
    return json;
  }

  async function run(){
    if (!access || !date){ setStatus("Missing data — open this page via the Sync button in PlateLog.", "err"); return; }
    const ok = await refreshIfNeeded();
    if (!ok) return;

    setStatus("Fetching steps, calories, and workouts…");
    const [stepsJson, calJson, exJson] = await Promise.all([
      fetchSteps(),
      fetchCaloriesRollup(),
      fetchExerciseUnfiltered()
    ]);

    const steps = stepsJson.error ? 0 : Math.round(sumSteps(stepsJson).total);
    const calories = calJson.error ? 0 : Math.round(sumCaloriesRollup(calJson));

    let exercises = [];
    if (!exJson.error){
      const points = exJson.dataPoints || [];
      const [y,m,d] = date.split("-").map(Number);
      exercises = points.filter(p => {
        const civ = p.exercise && p.exercise.interval && p.exercise.interval.civilStartTime && p.exercise.interval.civilStartTime.date;
        return civ && civ.year === y && civ.month === m && civ.day === d;
      }).map(p => {
        const ex = p.exercise || {};
        const ms = ex.metricsSummary || {};
        const durSec = ex.activeDuration ? parseInt(ex.activeDuration, 10) : null;
        return {
          name: ex.displayName || ex.exerciseType || "Workout",
          minutes: durSec ? Math.round(durSec/60) : null,
          kcal: ms.caloriesKcal != null ? Math.round(ms.caloriesKcal) : null
        };
      });
    }

    summaryEl.innerHTML = "Steps: <b>" + steps + "</b><br>Calories burned: <b>" + calories + "</b><br>Workouts found: <b>" + exercises.length + "</b>";

    const payload = { steps, calories, exercises, a: access, r: refresh, e: expiresAt, date };
    codeBox.value = btoa(JSON.stringify(payload));
    resultEl.style.display = "block";
    setStatus("Done.", "ok");
  }

  document.getElementById("copyBtn").addEventListener("click", () => {
    codeBox.select();
    document.execCommand("copy");
    document.getElementById("copyBtn").textContent = "Copied!";
  });

  run();
</script>
</body>
</html>
